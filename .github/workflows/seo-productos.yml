name: Generar paginas SEO de productos

on:
  schedule:
    - cron: '0 8 * * *'      # todos los dias 08:00 UTC (~05:00 Argentina)
  workflow_dispatch:          # permite ejecutarlo a mano desde la pestana Actions

permissions:
  contents: write

concurrency:
  group: seo-productos
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar paginas
        run: python scripts/gen_seo.py

      - name: Subir cambios si hay
        run: |
          git config user.name  "blinky-seo-bot"
          git config user.email "actions@github.com"
          git add p categoria marca producto.css producto.js sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Sin cambios: no hay nada que subir."
          else
            git commit -m "SEO: regenerar paginas de productos [skip ci]"
            git push
          fi
