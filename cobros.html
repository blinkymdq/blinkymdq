<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cobros rápidos — Blinky MDQ</title>
<link rel="icon" href="https://raw.githubusercontent.com/blinkymdq/blinkymdq/main/blinkysinfondo.png">
<!-- Ícono del acceso directo en el celu (logo de Blinky) -->
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/blinkymdq/blinkymdq/main/cobros-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cobros">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d14">
<style>
  :root{ --bg:#0d0d14; --surface:#171722; --surface2:#20202e; --border:#2c2c3d; --text:#f1f1f6; --text2:#b8b8c8; --text3:#7a7a90; --violet:#7c3aed; --violet-light:#a78bfa; --green:#22c55e; --red:#ef4444; --yellow:#fbbf24; --cyan:#22d3ee; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Inter',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  input,select,button{font-family:inherit;}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 60px;}
  header{display:flex;align-items:center;gap:10px;padding:14px 4px 18px;}
  header img{height:34px;}
  header .t{font-weight:900;font-size:1.15rem;}
  header .sub{font-size:0.72rem;color:var(--violet-light);font-weight:700;text-transform:uppercase;letter-spacing:1px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
  label{display:block;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--text3);margin-bottom:7px;}
  input[type=text],input[type=number],input[type=password],input[type=date],select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:14px;font-size:1rem;outline:none;}
  input:focus,select:focus{border-color:var(--violet);}
  .seg{display:flex;gap:8px;margin-bottom:16px;}
  .seg button{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:12px;padding:12px 6px;font-weight:800;font-size:0.85rem;cursor:pointer;transition:all .15s;}
  .seg button.on{background:var(--violet);border-color:var(--violet);color:#fff;}
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .chips button{background:var(--surface2);border:1.5px solid var(--border);color:var(--text2);border-radius:12px;padding:13px 8px;font-weight:800;font-size:0.9rem;cursor:pointer;}
  .chips button.on{background:rgba(124,58,237,.18);border-color:var(--violet);color:#fff;}
  .monto-input{font-size:1.7rem !important;font-weight:900;text-align:center;letter-spacing:0.5px;}
  .btn-big{width:100%;background:var(--green);color:#fff;border:none;border-radius:14px;padding:17px;font-size:1.05rem;font-weight:900;cursor:pointer;margin-top:4px;}
  .btn-big:disabled{opacity:0.6;}
  .info-box{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:0.9rem;}
  .info-box .deuda{font-size:1.4rem;font-weight:900;color:var(--yellow);}
  .info-box.ok .deuda{color:var(--green);}
  .muted{color:var(--text3);font-size:0.82rem;}
  .hidden{display:none !important;}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0f2e1f;border:1px solid var(--green);color:#dcfce7;border-radius:14px;padding:13px 20px;font-weight:800;font-size:0.92rem;z-index:999;opacity:0;transition:all .3s;pointer-events:none;text-align:center;max-width:92vw;}
  #toast.err{background:#3a0f16;border-color:var(--red);color:#fecaca;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @keyframes sp{to{transform:rotate(360deg);}}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;vertical-align:-2px;margin-right:7px;}
  /* login */
  #login{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;}
  #login .card{width:100%;text-align:left;}
  a.recibo{display:inline-block;margin-top:10px;background:var(--surface2);border:1px solid var(--border);color:var(--violet-light);border-radius:10px;padding:9px 14px;text-decoration:none;font-weight:800;font-size:0.85rem;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="https://raw.githubusercontent.com/blinkymdq/blinkymdq/main/blinkysinfondo.png" alt="Blinky">
    <div><div class="t">Cobros rápidos</div><div class="sub">Blinky MDQ</div></div>
  </header>

  <!-- LOGIN -->
  <div id="login" class="hidden">
    <div style="font-size:2.4rem;">🔒</div>
    <div style="font-weight:800;">Ingresá con tu cuenta de administrador</div>
    <div class="card">
      <label>Email</label>
      <input id="lg-email" type="text" autocomplete="username" placeholder="tu@email.com">
      <div style="height:12px;"></div>
      <label>Contraseña</label>
      <input id="lg-pass" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')loginAdmin()">
      <div id="lg-error" style="color:var(--red);font-size:0.8rem;font-weight:700;margin-top:10px;"></div>
      <button class="btn-big" style="background:var(--violet);margin-top:14px;" id="lg-btn" onclick="loginAdmin()">Ingresar</button>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <div class="seg">
      <button data-modo="cliente" class="on" onclick="setModo('cliente')">Cliente</button>
      <button data-modo="vendedor" onclick="setModo('vendedor')">Vendedor</button>
      <button data-modo="pedido" onclick="setModo('pedido')">Pedido</button>
    </div>

    <!-- Buscar persona (cliente/vendedor) -->
    <div id="box-persona" class="card">
      <label id="lbl-persona">Buscar cliente</label>
      <input id="in-persona" type="text" list="dl-personas" placeholder="Nombre, email o #número..." oninput="seleccionarPersona(this.value)" autocomplete="off">
      <datalist id="dl-personas"></datalist>
      <div id="persona-info" class="hidden info-box">
        <div class="muted" id="persona-nombre"></div>
        <div>Debe: <span class="deuda" id="persona-deuda">$0</span></div>
        <div class="muted" id="persona-extra"></div>
      </div>
    </div>

    <!-- Buscar pedido -->
    <div id="box-pedido" class="card hidden">
      <label>Número de pedido</label>
      <input id="in-pedido" type="text" placeholder="Ej: 0499 o #0499" oninput="buscarPedido(this.value)" autocomplete="off" inputmode="numeric">
      <div id="pedido-info" class="hidden info-box">
        <div class="muted" id="pedido-cliente"></div>
        <div>Saldo: <span class="deuda" id="pedido-saldo">$0</span></div>
        <div class="muted" id="pedido-extra"></div>
      </div>
    </div>

    <!-- Monto + forma de pago -->
    <div class="card">
      <label>Monto que cobrás</label>
      <input id="in-monto" type="number" inputmode="decimal" min="0" step="any" placeholder="$0" class="monto-input">
      <div style="height:16px;"></div>
      <label>Forma de pago</label>
      <div class="chips" id="chips-forma">
        <button data-forma="efectivo" class="on" onclick="setForma('efectivo')">💵 Efectivo</button>
        <button data-forma="transferencia" onclick="setForma('transferencia')">🏦 Transferencia</button>
        <button data-forma="transferencia_rm" onclick="setForma('transferencia_rm')">🏦 Transf. RM</button>
        <button data-forma="tarjeta" onclick="setForma('tarjeta')">💳 Tarjeta</button>
      </div>
    </div>

    <button class="btn-big" id="btn-cobrar" onclick="registrarCobro()">✓ Registrar cobro</button>
    <div id="resultado" style="margin-top:14px;"></div>

    <div style="text-align:center;margin-top:24px;">
      <button onclick="logout()" style="background:none;border:none;color:var(--text3);font-size:0.78rem;font-weight:700;cursor:pointer;text-decoration:underline;">Cerrar sesión</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://fcaytkwcypktvrmerexp.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjYXl0a3djeXBrdHZybWVyZXhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MDU1OTYsImV4cCI6MjA5NzM4MTU5Nn0.7GiUl0o_B3dAnpE2x98sBqtC0eY9HoM6p67fOBghoJY';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);
const hdrs = {'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Prefer':'return=representation'};

let modo = 'cliente';
let forma = 'efectivo';
let usuarios = [];
let personaSel = null;
let pedidoSel = null;

function $(id){ return document.getElementById(id); }
function money(n){ return '$'+Number(n||0).toLocaleString('es-AR'); }
function toast(msg, err){ const t=$('toast'); t.innerHTML=msg; t.className='show'+(err?' err':''); clearTimeout(t._t); t._t=setTimeout(()=>t.className='',3200); }
function formaLabel(f){ return ({efectivo:'Efectivo',transferencia:'Transferencia',transferencia_rm:'Transferencia RM',tarjeta:'Tarjeta'})[f]||f; }

// ---- AUTH ----
async function loginAdmin(){
  const email=$('lg-email').value.trim(); const pass=$('lg-pass').value;
  if(!email||!pass){ $('lg-error').textContent='Completá email y contraseña.'; return; }
  const btn=$('lg-btn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>Ingresando...';
  const { error } = await supa.auth.signInWithPassword({ email, password: pass });
  if(error){ $('lg-error').textContent='Email o contraseña incorrectos.'; btn.disabled=false; btn.textContent='Ingresar'; return; }
  await verificarSesion();
  btn.disabled=false; btn.textContent='Ingresar';
}
async function logout(){ await supa.auth.signOut(); location.reload(); }
const EMAIL_AUTORIZADO = 'maximilianomjm@gmail.com';
async function verificarSesion(){
  const { data:{ session } } = await supa.auth.getSession();
  if(!session){ $('login').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
  hdrs.Authorization = 'Bearer '+session.access_token;
  const email = (session.user && session.user.email || '').toLowerCase();
  if(email !== EMAIL_AUTORIZADO){
    $('lg-error').textContent='Esta cuenta no tiene acceso a los cobros.';
    $('login').classList.remove('hidden'); $('app').classList.add('hidden');
    await supa.auth.signOut();
    return;
  }
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  cargarUsuarios();
}
supa.auth.onAuthStateChange((e,s)=>{ if(s) hdrs.Authorization='Bearer '+s.access_token; });
verificarSesion();

// ---- Modo / forma ----
function setModo(m){
  modo = m;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on', b.dataset.modo===m));
  const esPersona = (m==='cliente'||m==='vendedor');
  $('box-persona').classList.toggle('hidden', !esPersona);
  $('box-pedido').classList.toggle('hidden', esPersona);
  $('lbl-persona').textContent = m==='vendedor' ? 'Buscar vendedor' : 'Buscar cliente';
  $('in-persona').value=''; personaSel=null; $('persona-info').classList.add('hidden');
  $('in-pedido').value=''; pedidoSel=null; $('pedido-info').classList.add('hidden');
  $('resultado').innerHTML='';
  llenarPersonas();
}
function setForma(f){ forma=f; document.querySelectorAll('#chips-forma button').forEach(b=>b.classList.toggle('on', b.dataset.forma===f)); }

// ---- Usuarios ----
async function cargarUsuarios(){
  try{ usuarios = await (await fetch(`${SUPA_URL}/rest/v1/usuarios?select=id,numero_usuario,nombre,email,rol,es_vendedor,saldo_favor&order=nombre.asc`, {headers:hdrs})).json(); }catch(e){ usuarios=[]; }
  llenarPersonas();
}
function llenarPersonas(){
  const lista = (modo==='vendedor') ? usuarios.filter(u=>u.es_vendedor) : usuarios;
  $('dl-personas').innerHTML = lista.map(u=>`<option value="#${u.numero_usuario||''} - ${u.nombre} (${u.email||''})">`).join('');
}
async function seleccionarPersona(val){
  const lista = (modo==='vendedor') ? usuarios.filter(u=>u.es_vendedor) : usuarios;
  const u = lista.find(x=>`#${x.numero_usuario||''} - ${x.nombre} (${x.email||''})`===val);
  personaSel = u || null;
  const box = $('persona-info');
  if(!u){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  $('persona-nombre').textContent = `${u.nombre} · ${u.rol==='mayorista'?'Mayorista':'Minorista'}${u.es_vendedor?' · Vendedor':''}`;
  $('persona-deuda').textContent = '...';
  $('persona-extra').textContent = '';
  const pend = await pendientesDe(u);
  const deuda = pend.reduce((s,p)=>s+(Number(p.total||0)-Number(p.monto_pagado||0)),0);
  $('persona-deuda').textContent = money(deuda);
  box.classList.toggle('ok', deuda<=0);
  let extra = `${pend.length} pedido${pend.length===1?'':'s'} impago${pend.length===1?'':'s'}`;
  if(Number(u.saldo_favor||0)>0) extra += ` · Saldo a favor: ${money(u.saldo_favor)}`;
  $('persona-extra').textContent = extra;
}
async function pendientesDe(u){
  const conds = [`user_id.eq.${u.id}`];
  if(u.email) conds.push(`email.eq.${encodeURIComponent(u.email)}`);
  let peds = await (await fetch(`${SUPA_URL}/rest/v1/pedidos?or=(${conds.join(',')})&select=numero_pedido,total,monto_pagado,created_at&order=created_at.asc`, {headers:hdrs})).json();
  return (peds||[]).filter(p=> Number(p.monto_pagado||0) < Number(p.total||0));
}

// ---- Pedido ----
let _pedTimer;
function buscarPedido(val){
  clearTimeout(_pedTimer);
  _pedTimer = setTimeout(()=>_buscarPedido(val), 350);
}
async function _buscarPedido(val){
  let num = (val||'').trim().replace(/^#/,'');
  const box=$('pedido-info');
  if(!num){ box.classList.add('hidden'); pedidoSel=null; return; }
  if(!num.startsWith('#')) num = '#'+num;
  try{
    const ps = await (await fetch(`${SUPA_URL}/rest/v1/pedidos?numero_pedido=eq.${encodeURIComponent(num)}&select=numero_pedido,nombre,email,total,monto_pagado&limit=1`, {headers:hdrs})).json();
    if(!ps.length){ box.classList.add('hidden'); pedidoSel=null; return; }
    pedidoSel = ps[0];
    const saldo = Math.max(0, Number(pedidoSel.total||0)-Number(pedidoSel.monto_pagado||0));
    box.classList.remove('hidden');
    box.classList.toggle('ok', saldo<=0);
    $('pedido-cliente').textContent = `${pedidoSel.numero_pedido} · ${pedidoSel.nombre||''}`;
    $('pedido-saldo').textContent = money(saldo);
    $('pedido-extra').textContent = `Total ${money(pedidoSel.total)} · Pagado ${money(pedidoSel.monto_pagado)}`;
  }catch(e){ box.classList.add('hidden'); pedidoSel=null; }
}

// ---- Registrar cobro ----
async function registrarCobro(){
  const monto = parseFloat($('in-monto').value);
  if(!monto || monto<=0){ toast('Poné un monto válido', true); return; }
  const btn=$('btn-cobrar'); btn.disabled=true; const _t=btn.textContent; btn.innerHTML='<span class="spin"></span>Registrando...';
  try{
    if(modo==='pedido'){ await cobrarPedido(monto); }
    else { await cobrarPersona(monto); }
  }catch(e){ console.error(e); toast('Error al registrar el cobro', true); }
  btn.disabled=false; btn.textContent=_t;
}

async function cobrarPedido(monto){
  if(!pedidoSel){ toast('Buscá y elegí un pedido', true); return; }
  const num = pedidoSel.numero_pedido;
  const p = (await (await fetch(`${SUPA_URL}/rest/v1/pedidos?numero_pedido=eq.${encodeURIComponent(num)}&limit=1`, {headers:hdrs})).json())[0];
  if(!p){ toast('Pedido no encontrado', true); return; }
  const total = Number(p.total||0);
  const actual = Number(p.monto_pagado||0);
  const restante = Math.max(total-actual, 0);
  const exceso = Math.max(monto-restante, 0);
  const nuevo = Math.min(actual+monto, total);
  const ins = await (await fetch(`${SUPA_URL}/rest/v1/pagos`, {method:'POST', headers:hdrs, body:JSON.stringify({numero_pedido:num, monto, forma_pago:forma, exceso_acreditado:exceso, descripcion:null})})).json();
  await fetch(`${SUPA_URL}/rest/v1/pedidos?numero_pedido=eq.${encodeURIComponent(num)}`, {method:'PATCH', headers:hdrs, body:JSON.stringify({monto_pagado:nuevo})});
  if(exceso>0 && p.email){ await acreditarSaldo(p.email, exceso); }
  if(p.email){ fetch(`${SUPA_URL}/functions/v1/notificar-pago`, {method:'POST', headers:hdrs, body:JSON.stringify({ email:p.email, nombre:p.nombre||'', numero_pedido:num, monto, forma_pago:forma })}).catch(()=>{}); }
  const token = ins && ins[0] && ins[0].token;
  toast('✓ Cobro registrado');
  finalizar(`Cobraste ${money(monto)} a <b>${p.nombre||num}</b> (${formaLabel(forma)}).${exceso>0?`<br>${money(exceso)} quedaron a favor del cliente.`:''}<br>Saldo del pedido: <b>${money(Math.max(0,total-nuevo))}</b>`, token);
  $('in-monto').value=''; buscarPedido(num);
}

async function cobrarPersona(monto){
  if(!personaSel){ toast('Buscá y elegí una persona', true); return; }
  const pend = await pendientesDe(personaSel);
  const totalPend = pend.reduce((s,x)=>s+(Number(x.total||0)-Number(x.monto_pagado||0)),0);
  if(totalPend<=0 && monto>0){
    // Sin deuda: todo va a saldo a favor
    if(!confirm(`${personaSel.nombre} no tiene deuda. ¿Cargar ${money(monto)} como saldo a favor?`)){ return; }
  }
  let restante = monto, aplicado = 0, tokenUnico = null, cuenta = 0;
  for(const p of pend){
    if(restante<=0) break;
    const pen = Number(p.total||0)-Number(p.monto_pagado||0);
    const aplicar = Math.min(restante, pen);
    if(aplicar<=0) continue;
    const ins = await (await fetch(`${SUPA_URL}/rest/v1/pagos`, {method:'POST', headers:hdrs, body:JSON.stringify({ numero_pedido:p.numero_pedido, monto:aplicar, forma_pago:forma, exceso_acreditado:0, descripcion:'Pago a cuenta' })})).json();
    await fetch(`${SUPA_URL}/rest/v1/pedidos?numero_pedido=eq.${encodeURIComponent(p.numero_pedido)}`, {method:'PATCH', headers:hdrs, body:JSON.stringify({ monto_pagado: Number(p.monto_pagado||0)+aplicar })});
    tokenUnico = ins && ins[0] && ins[0].token; cuenta++;
    restante -= aplicar; aplicado += aplicar;
  }
  // Excedente -> saldo a favor (registrado en el último pedido, o directo si no hay pedidos)
  if(restante>0){
    if(pend.length){
      const last = pend[pend.length-1];
      await fetch(`${SUPA_URL}/rest/v1/pagos`, {method:'POST', headers:hdrs, body:JSON.stringify({ numero_pedido:last.numero_pedido, monto:restante, forma_pago:forma, exceso_acreditado:restante, descripcion:'Pago a cuenta (excedente a saldo a favor)' })});
    }
    await acreditarSaldo(personaSel.email, restante, personaSel.id);
  }
  if(personaSel.email){ fetch(`${SUPA_URL}/functions/v1/notificar-pago`, {method:'POST', headers:hdrs, body:JSON.stringify({ email:personaSel.email, nombre:personaSel.nombre||'', monto, forma_pago:forma })}).catch(()=>{}); }
  toast('✓ Cobro registrado');
  const nuevaDeuda = Math.max(0, totalPend - aplicado);
  let msg = `Cobraste ${money(monto)} a <b>${personaSel.nombre}</b> (${formaLabel(forma)}).`;
  if(cuenta>0) msg += `<br>Aplicado a ${cuenta} pedido${cuenta===1?'':'s'}. Deuda restante: <b>${money(nuevaDeuda)}</b>`;
  if(restante>0) msg += `<br>${money(restante)} quedaron como saldo a favor.`;
  finalizar(msg, (cuenta===1?tokenUnico:null));
  $('in-monto').value='';
  seleccionarPersona($('in-persona').value);
}

async function acreditarSaldo(email, monto, uid){
  try{
    let user=null;
    if(uid){ const r=await (await fetch(`${SUPA_URL}/rest/v1/usuarios?id=eq.${uid}&select=id,saldo_favor`, {headers:hdrs})).json(); user=r[0]; }
    else if(email){ const r=await (await fetch(`${SUPA_URL}/rest/v1/usuarios?email=eq.${encodeURIComponent(email)}&select=id,saldo_favor`, {headers:hdrs})).json(); user=r[0]; }
    if(user){ await fetch(`${SUPA_URL}/rest/v1/usuarios?id=eq.${user.id}`, {method:'PATCH', headers:hdrs, body:JSON.stringify({ saldo_favor: Number(user.saldo_favor||0)+monto })}); }
  }catch(e){}
}

function finalizar(msg, token){
  $('resultado').innerHTML = `<div class="info-box ok"><div style="font-weight:800;color:var(--green);margin-bottom:4px;">✓ Listo</div><div style="font-size:0.9rem;line-height:1.5;">${msg}</div>${token?`<a class="recibo" href="https://blinkymdq.github.io/blinkymdq/recibo-pago.html?t=${token}" target="_blank">🧾 Ver / imprimir recibo</a>`:''}</div>`;
}
</script>
</body>
</html>
