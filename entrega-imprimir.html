<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprobante de entrega — Blinky MDQ</title>
<link rel="icon" href="https://raw.githubusercontent.com/blinkymdq/blinkymdq/main/blinkysinfondo.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Arial,Helvetica,sans-serif;background:#eef0f4;color:#1e293b;padding:24px 12px;}
  .toolbar{max-width:720px;margin:0 auto 16px;display:flex;gap:10px;justify-content:flex-end;}
  .btn{background:#7c3aed;color:#fff;border:none;border-radius:9px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn.sec{background:#fff;color:#334155;border:1px solid #cbd5e1;}
  .hoja{max-width:720px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.08);overflow:hidden;}
  .top{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;padding:26px 34px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .top img{height:42px;filter:invert(1);}
  .top .doc{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#e9d5ff;}
  .top .num{font-size:24px;font-weight:900;}
  .meta{display:flex;flex-wrap:wrap;gap:24px;padding:22px 34px;border-bottom:1px solid #e2e8f0;font-size:13px;}
  .meta .k{color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
  .meta .v{font-weight:700;margin-top:2px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{background:#f8fafc;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.3px;text-align:left;padding:10px 34px;border-bottom:2px solid #e2e8f0;}
  thead th.c,tbody td.c,tfoot td.c{text-align:center;}
  tbody td{padding:11px 34px;border-bottom:1px solid #eef2f7;}
  tfoot td{padding:16px 34px;font-weight:900;font-size:16px;}
  tfoot td.lbl{text-align:right;color:#64748b;font-weight:700;font-size:13px;}
  .foot{padding:18px 34px;color:#94a3b8;font-size:11px;text-align:center;border-top:1px solid #e2e8f0;}
  .cargando{max-width:720px;margin:40px auto;text-align:center;color:#64748b;}
  @media print{ body{background:#fff;padding:0;} .toolbar{display:none;} .hoja{box-shadow:none;border-radius:0;max-width:none;} }
</style>
</head>
<body>
<div class="toolbar">
  <a class="btn sec" href="index.html">← Inicio</a>
  <button class="btn" onclick="window.print()">⬇ Descargar / Imprimir PDF</button>
</div>
<div id="cont" class="cargando">Cargando comprobante…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://fcaytkwcypktvrmerexp.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjYXl0a3djeXBrdHZybWVyZXhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MDU1OTYsImV4cCI6MjA5NzM4MTU5Nn0.7GiUl0o_B3dAnpE2x98sBqtC0eY9HoM6p67fOBghoJY';

async function cargar(){
  const t=new URLSearchParams(location.search).get('t');
  const cont=document.getElementById('cont');
  if(!t){ cont.textContent='Comprobante no encontrado.'; return; }
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/rpc/get_entrega_por_token`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY},body:JSON.stringify({p_token:t})});
    const d=await r.json();
    if(!d || !d.numero){ cont.textContent='Comprobante no encontrado.'; return; }
    render(d);
  }catch(e){ cont.textContent='No se pudo cargar el comprobante.'; }
}
function render(c){
  const fecha=new Date(c.created_at).toLocaleString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const items=Array.isArray(c.items)?c.items:[];
  const filas=items.map(i=>`
    <tr>
      <td>${i.producto||''}${i.codigo?` <span style="color:#94a3b8;">(${i.codigo})</span>`:''}</td>
      <td class="c" style="font-weight:700;">${Number(i.cantidad||0)}</td>
    </tr>`).join('');
  document.getElementById('cont').outerHTML=`
  <div class="hoja">
    <div class="top">
      <img src="https://raw.githubusercontent.com/blinkymdq/blinkymdq/main/blinkysinfondo.png" alt="Blinky MDQ">
      <div style="text-align:right;"><div class="doc">Comprobante de entrega</div><div class="num">${c.numero}</div></div>
    </div>
    <div class="meta">
      <div><div class="k">Fecha</div><div class="v">${fecha}</div></div>
      <div><div class="k">Vendedor</div><div class="v">${c.vendedor_nombre||'—'}</div></div>
      <div><div class="k">Total unidades</div><div class="v">${c.total_unidades||0}</div></div>
    </div>
    <table>
      <thead><tr><th>Producto</th><th class="c">Cantidad</th></tr></thead>
      <tbody>${filas}</tbody>
      <tfoot><tr><td class="lbl">TOTAL UNIDADES</td><td class="c" style="color:#7c3aed;">${c.total_unidades||0}</td></tr></tfoot>
    </table>
    <div style="padding:14px 34px;color:#64748b;font-size:12px;">Mercadería entregada en consignación para la venta.</div>
    <div class="foot">Blinky MDQ · Mar del Plata · blinkymdq.com</div>
  </div>`;
}
cargar();
</script>
</body>
</html>
