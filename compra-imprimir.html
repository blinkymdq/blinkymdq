<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprobante de compra — Blinky MDQ</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Arial,Helvetica,sans-serif;background:#eef0f4;color:#1e293b;padding:24px 12px;}
  .toolbar{max-width:800px;margin:0 auto 16px;display:flex;gap:10px;justify-content:flex-end;}
  .btn{background:#7c3aed;color:#fff;border:none;border-radius:9px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn.sec{background:#fff;color:#334155;border:1px solid #cbd5e1;}
  .hoja{max-width:800px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.08);overflow:hidden;}
  .top{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:26px 34px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .top img{height:44px;filter:invert(1);}
  .top .doc{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#cbd5e1;}
  .top .num{font-size:26px;font-weight:900;}
  .meta{display:flex;flex-wrap:wrap;gap:24px;padding:22px 34px;border-bottom:1px solid #e2e8f0;font-size:13px;}
  .meta .k{color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
  .meta .v{font-weight:700;margin-top:2px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{background:#f8fafc;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.3px;text-align:left;padding:10px 34px;border-bottom:2px solid #e2e8f0;}
  thead th.r,tbody td.r,tfoot td.r{text-align:right;}
  thead th.c,tbody td.c{text-align:center;}
  tbody td{padding:11px 34px;border-bottom:1px solid #eef2f7;}
  tfoot td{padding:16px 34px;font-weight:900;font-size:16px;}
  tfoot td.lbl{text-align:right;color:#64748b;font-weight:700;font-size:13px;}
  .foot{padding:18px 34px;color:#94a3b8;font-size:11px;text-align:center;border-top:1px solid #e2e8f0;}
  .cargando{max-width:800px;margin:40px auto;text-align:center;color:#64748b;}
  @media print{ body{background:#fff;padding:0;} .toolbar{display:none;} .hoja{box-shadow:none;border-radius:0;max-width:none;} }
</style>
</head>
<body>
<div class="toolbar">
  <a class="btn sec" href="index.html">← Inicio</a>
  <button class="btn" onclick="window.print()">⬇ Descargar / Imprimir PDF</button>
</div>
<div id="cont" class="cargando">Cargando comprobante…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://fcaytkwcypktvrmerexp.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjYXl0a3djeXBrdHZybWVyZXhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MDU1OTYsImV4cCI6MjA5NzM4MTU5Nn0.7GiUl0o_B3dAnpE2x98sBqtC0eY9HoM6p67fOBghoJY';
const money = n => '$' + Number(n||0).toLocaleString('es-AR');

async function cargar(){
  const t = new URLSearchParams(location.search).get('t');
  const cont = document.getElementById('cont');
  if(!t){ cont.textContent = 'Comprobante no encontrado (falta el token).'; return; }
  try{
    const r = await fetch(`${SUPA_URL}/rest/v1/rpc/get_compra_por_token`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:SUPA_KEY, Authorization:'Bearer '+SUPA_KEY },
      body: JSON.stringify({ p_token: t })
    });
    const data = await r.json();
    if(!data || !data.compra){ cont.textContent = 'Comprobante no encontrado.'; return; }
    render(data.compra, data.items||[]);
  }catch(e){ cont.textContent = 'No se pudo cargar el comprobante.'; }
}

function render(c, items){
  const fecha = new Date(c.created_at).toLocaleString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const monedaLbl = c.moneda === 'usd' ? 'USD' : 'Pesos';
  const cajaLbl = ({efectivo:'Efectivo',transferencia:'Transferencia',transferencia_rm:'Transferencia RM',tarjeta:'Tarjeta'})[c.forma_pago] || (c.forma_pago||'—');
  const filas = items.map(i=>`
    <tr>
      <td>${i.producto||''}${i.codigo?` <span style="color:#94a3b8;">(${i.codigo})</span>`:''}</td>
      <td class="c">${Number(i.cantidad)}</td>
      <td class="r">${c.moneda==='usd' ? 'US$'+Number(i.costo_unitario).toLocaleString('es-AR') : money(i.costo_unitario)}</td>
      <td class="r">${money(i.costo_final)}</td>
      <td class="r" style="font-weight:700;">${money(i.costo_total)}</td>
    </tr>`).join('');
  document.getElementById('cont').outerHTML = `
  <div class="hoja">
    <div class="top">
      <img src="https://raw.githubusercontent.com/blinkymdq/blinkymdq/main/blinkysinfondo.png" alt="Blinky MDQ">
      <div style="text-align:right;">
        <div class="doc">Comprobante de compra</div>
        <div class="num">${c.numero_compra||''}</div>
      </div>
    </div>
    <div class="meta">
      <div><div class="k">Fecha</div><div class="v">${fecha}</div></div>
      <div><div class="k">Proveedor</div><div class="v">${c.proveedor||'—'}</div></div>
      <div><div class="k">Moneda</div><div class="v">${monedaLbl}</div></div>
      ${c.moneda==='usd'?`<div><div class="k">Valor dólar</div><div class="v">$${Number(c.valor_dolar).toLocaleString('es-AR')}</div></div>`:''}
      <div><div class="k">Cuenta</div><div class="v">${cajaLbl}</div></div>
    </div>
    <table>
      <thead><tr>
        <th>Producto</th><th class="c">Cant.</th>
        <th class="r">Costo unit.</th><th class="r">Costo final $</th><th class="r">Costo total</th>
      </tr></thead>
      <tbody>${filas}</tbody>
      <tfoot><tr><td colspan="4" class="lbl">TOTAL COMPRA</td><td class="r" style="color:#7c3aed;">${money(c.total)}</td></tr></tfoot>
    </table>
    ${c.notas?`<div style="padding:16px 34px;color:#64748b;font-size:12px;"><b>Notas:</b> ${c.notas}</div>`:''}
    <div class="foot">Blinky MDQ · Mar del Plata · blinkymdq.com · Documento interno de compra</div>
  </div>`;
}
cargar();
</script>
</body>
</html>
