<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cajas Sorpresa — Blinky MDQ</title>
<link rel="icon" href="https://raw.githubusercontent.com/blinkymdq/blinkymdq/main/blinkysinfondo.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',Arial,sans-serif;min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%, #2b1466 0%, #17093a 45%, #0b0620 100%);color:#fff;display:flex;flex-direction:column;}
  a{color:inherit;text-decoration:none;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;}
  .top img{height:42px;}
  .top .volver{font-size:0.82rem;font-weight:700;color:#c4b5fd;background:rgba(255,255,255,0.08);padding:8px 14px;border-radius:999px;}
  .wrap{flex:1;max-width:760px;margin:0 auto;padding:10px 18px 60px;width:100%;text-align:center;}
  h1{font-size:2rem;font-weight:900;margin-top:14px;letter-spacing:-0.5px;}
  .sub{color:#c4b5fd;font-size:0.95rem;margin-top:8px;line-height:1.5;}
  .boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px;}
  @media(max-width:560px){ .boxes{gap:10px;} h1{font-size:1.6rem;} }
  .box{background:linear-gradient(160deg,#7c3aed,#5b21b6);border:none;border-radius:20px;padding:26px 10px 22px;cursor:pointer;position:relative;overflow:hidden;transition:transform .18s ease, box-shadow .18s ease;box-shadow:0 10px 30px rgba(124,58,237,.35);}
  .box:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 16px 40px rgba(124,58,237,.5);}
  .box::before{content:'';position:absolute;top:0;left:-140%;width:65%;height:100%;background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,0.45) 50%,transparent 100%);transform:skewX(-20deg);pointer-events:none;z-index:4;animation:boxShine 3.6s ease-in-out infinite;}
  .box:nth-child(2)::before{animation-delay:1.2s;}
  .box:nth-child(3)::before{animation-delay:2.4s;}
  @keyframes boxShine{0%{left:-140%;}28%{left:150%;}100%{left:150%;}}
  .box::after{content:'';position:absolute;inset:0;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,0.18),rgba(255,255,255,0) 42%);pointer-events:none;}
  .box .emoji{font-size:3.2rem;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));transition:transform .2s;}
  .box:hover .emoji{transform:rotate(-6deg) scale(1.08);}
  .caja-img{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4));transition:transform .2s;}
  .box:hover .caja-img{transform:rotate(-5deg) scale(1.08);}
  @media(max-width:560px){ .caja-img{width:74px;height:74px;} }
  .box .lbl{display:block;margin-top:12px;font-size:0.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#f5f3ff;}
  .box.abriendo{animation:shake .5s ease;}
  .box.ganadora{background:linear-gradient(160deg,#f59e0b,#d97706);box-shadow:0 16px 45px rgba(245,158,11,.55);}
  .box.perdedora{opacity:.35;filter:grayscale(.5);pointer-events:none;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:22px;padding:30px 26px;margin-top:30px;backdrop-filter:blur(6px);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#5b21b6;font-weight:900;border:none;border-radius:14px;padding:14px 22px;font-size:0.95rem;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;}
  .btn.alt{background:rgba(255,255,255,0.12);color:#fff;}
  .btn.google{background:#fff;color:#334155;font-weight:700;text-transform:none;}
  .premio-monto{font-size:3rem;font-weight:900;color:#fbbf24;margin:6px 0;text-shadow:0 4px 20px rgba(251,191,36,.4);}
  .cupon-code{display:inline-block;font-family:monospace;font-size:1.15rem;font-weight:800;letter-spacing:2px;background:#fff;color:#5b21b6;padding:10px 18px;border-radius:12px;margin:10px 0;}
  .muted{color:#c4b5fd;font-size:0.85rem;line-height:1.55;}
  .acciones{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
  .hidden{display:none;}
  .conf{font-size:1.6rem;letter-spacing:6px;}
  /* ===== Header estilo tienda (oscuro) ===== */
  .bk-header{background:#0a0a0a url('back.webp') center/cover no-repeat;position:sticky;top:0;z-index:50;}
  .bk-row1{max-width:80rem;margin:0 auto;padding:0 1rem;min-height:96px;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
  .bk-search{flex:1;min-width:180px;position:relative;}
  .bk-search input{width:100%;height:44px;padding:0 3rem 0 1.25rem;background:#fff;border:2px solid #7c3aed;border-radius:999px;font-size:13px;font-weight:500;color:#1e293b;outline:none;}
  .bk-search .lupa{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:#7c3aed;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .bk-user{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .bk-cart{background:none;border:none;cursor:pointer;padding:6px;display:flex;position:relative;}
  .bk-row2{border-top:1px solid rgba(255,255,255,0.08);}
  .bk-row2-inner{max-width:80rem;margin:0 auto;padding:0 1rem;height:46px;display:flex;align-items:center;gap:0.25rem;}
  .nav-link{position:relative;overflow:hidden;border-radius:9px;}
  .nav-link select{appearance:none;-webkit-appearance:none;height:36px;background:transparent;color:#fff;border:none;border-radius:9px;padding:0 2.25rem 0 2.5rem;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.05em;outline:none;cursor:pointer;}
  .nav-link select option{color:#1e293b;background:#fff;}
  .nav-link::after{content:'';position:absolute;top:0;left:-130%;width:55%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,0.4),transparent);transform:skewX(-20deg);pointer-events:none;opacity:0;}
  .nav-link:hover::after{animation:navShine 0.7s ease;}
  @keyframes navShine{0%{left:-130%;opacity:1;}100%{left:140%;opacity:1;}}
  @keyframes logoDrop{0%{opacity:0;transform:translateY(-180px);animation-timing-function:ease-in;}50%{opacity:1;transform:translateY(0);animation-timing-function:ease-out;}66%{transform:translateY(-34px);animation-timing-function:ease-in;}80%{transform:translateY(0);animation-timing-function:ease-out;}90%{transform:translateY(-13px);animation-timing-function:ease-in;}96%{transform:translateY(0);animation-timing-function:ease-out;}98%{transform:translateY(-4px);}100%{transform:translateY(0);}}
  .logo-anim{animation:logoDrop 1.3s both;}
  @media (prefers-reduced-motion:reduce){.logo-anim{animation:none;}}
  @media (max-width:640px){ .bk-row1{min-height:auto;padding:8px 12px;} .bk-row2-inner{padding:0 12px;} }
</style>
</head>
<body>
  <header class="bk-header">
    <div class="bk-row1">
      <a href="index.html" title="Volver a la tienda" style="flex-shrink:0;">
        <img src="https://raw.githubusercontent.com/blinkymdq/blinkymdq/main/blinkysinfondo.png" alt="Blinky MDQ" class="logo-anim" style="height:58px;width:auto;object-fit:contain;">
      </a>
      <div class="bk-search">
        <input type="text" id="bk-buscar" placeholder="Buscar producto..." autocomplete="off" onkeydown="if(event.key==='Enter') bkBuscar()">
        <button class="lupa" onclick="bkBuscar()" aria-label="Buscar">
          <svg style="width:16px;height:16px;" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>
      <div class="bk-user" style="position:relative;">
        <div onclick="bkUserClick()" style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <svg style="width:22px;height:22px;flex-shrink:0;" fill="none" stroke="#7c3aed" stroke-width="1.8" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <div style="text-align:left;">
            <div id="bk-hola" style="font-size:9px;color:#cbd5e1;font-weight:600;line-height:1;display:none;">Hola,</div>
            <div id="bk-header-name" style="font-size:11px;font-weight:900;color:#fff;text-transform:uppercase;line-height:1.2;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Ingresá</div>
          </div>
          <span id="bk-chev" style="display:none;align-items:center;justify-content:center;width:22px;height:22px;background:#7c3aed;border-radius:6px;flex-shrink:0;">
            <svg style="width:12px;height:12px;" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
        <div id="bk-menu" style="display:none;position:absolute;right:0;top:100%;margin-top:6px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);border:1px solid #e2e8f0;padding:4px;min-width:170px;z-index:60;">
          <a href="mi-cuenta.html" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;font-size:12px;font-weight:700;color:#1e293b;text-transform:uppercase;letter-spacing:.03em;">Mi cuenta</a>
          <a href="index.html" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;font-size:12px;font-weight:700;color:#1e293b;text-transform:uppercase;letter-spacing:.03em;">← Volver a la tienda</a>
          <button onclick="logout()" style="width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;font-size:12px;font-weight:700;color:#ef4444;text-transform:uppercase;letter-spacing:.03em;background:none;border:none;cursor:pointer;text-align:left;">Cerrar sesión</button>
        </div>
      </div>
      <a href="index.html" class="bk-cart" title="Ir al carrito">
        <svg style="width:26px;height:26px;" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      </a>
    </div>
    <div class="bk-row2">
      <div class="bk-row2-inner">
        <div class="nav-link">
          <select id="bk-cat" onchange="bkFiltrar(this.value,'cat')"><option value="" style="color:#1e293b;">Categorías</option></select>
          <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;pointer-events:none;" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          <svg style="position:absolute;right:10px;top:50%;transform:translateY(-50%);width:12px;height:12px;pointer-events:none;" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <span style="color:rgba(255,255,255,0.25);font-weight:300;font-size:18px;line-height:1;user-select:none;">|</span>
        <div class="nav-link">
          <select id="bk-marca" onchange="bkFiltrar(this.value,'marca')" style="padding:0 2rem 0 2.25rem;"><option value="" style="color:#1e293b;">Marcas</option></select>
          <svg style="position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;pointer-events:none;" fill="none" stroke="#fff" stroke-width="1.8" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.5" fill="#fff"/></svg>
          <svg style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:12px;height:12px;pointer-events:none;" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
    </div>
  </header>

  <div class="wrap">
    <img src="Cajas-sorpresa-banner.png" alt="Cajas Sorpresa" style="width:100%;max-width:100%;height:auto;display:block;margin:14px auto 0;border-radius:16px;" onerror="this.replaceWith(Object.assign(document.createElement('h1'),{textContent:'🎁 Cajas Sorpresa',style:'font-size:2rem;font-weight:900;margin-top:14px;'}))">
    <div class="sub" id="sub" style="min-height:0;margin:0;"></div>

    <!-- No logueado -->
    <div id="vista-login" class="card hidden">
      <div style="font-size:2.4rem;">🔒</div>
      <div style="font-size:1.15rem;font-weight:800;margin-top:8px;">Ingresá para jugar</div>
      <div class="muted" style="margin:8px 0 18px;">Necesitás tu cuenta para que el premio quede guardado en tus cupones.</div>
      <button class="btn google" onclick="login()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:18px;height:18px;"> Ingresar con Google
      </button>
      <div class="muted" style="margin-top:14px;">¿Usás email y contraseña? <a href="index.html" style="color:#fff;text-decoration:underline;">Ingresá desde la tienda</a> y volvé.</div>
    </div>

    <!-- Cajas -->
    <div id="vista-juego" class="hidden">
      <div class="boxes" id="boxes">
        <button class="box" data-i="0" onclick="abrir(0)"><img class="caja-img" src="caja-cerrada.png" alt="Caja 1" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'emoji',textContent:'🎁'}))"><span class="lbl">Caja 1</span></button>
        <button class="box" data-i="1" onclick="abrir(1)"><img class="caja-img" src="caja-cerrada.png" alt="Caja 2" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'emoji',textContent:'🎁'}))"><span class="lbl">Caja 2</span></button>
        <button class="box" data-i="2" onclick="abrir(2)"><img class="caja-img" src="caja-cerrada.png" alt="Caja 3" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'emoji',textContent:'🎁'}))"><span class="lbl">Caja 3</span></button>
      </div>
    </div>

    <!-- Resultado -->
    <div id="vista-resultado" class="card hidden">
      <img src="caja-abierta.png" alt="¡Ganaste!" style="width:200px;height:200px;object-fit:contain;display:block;margin:0 auto 6px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45));" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'conf',textContent:'🎉 ✨ 🎉'}))">
      <div style="font-size:1.15rem;font-weight:800;margin-top:6px;" id="res-titulo">¡Ganaste!</div>
      <div class="premio-monto" id="res-monto">$0</div>
      <div class="muted">de descuento en tu próxima compra</div>
      <div style="margin-top:14px;">Tu cupón:</div>
      <div class="cupon-code" id="res-codigo">—</div>
      <div class="muted" id="res-detalle"></div>
      <div class="acciones">
        <a class="btn" href="mi-cuenta.html">Ver mis cupones</a>
        <a class="btn alt" href="index.html">Ir a comprar 🛍️</a>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://fcaytkwcypktvrmerexp.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjYXl0a3djeXBrdHZybWVyZXhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MDU1OTYsImV4cCI6MjA5NzM4MTU5Nn0.7GiUl0o_B3dAnpE2x98sBqtC0eY9HoM6p67fOBghoJY';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);
let jugando = false;

function $(id){ return document.getElementById(id); }
function money(n){ return '$' + Number(n||0).toLocaleString('es-AR'); }
function mostrar(v){ ['vista-login','vista-juego','vista-resultado'].forEach(x=>$(x).classList.toggle('hidden', x!==v)); }

async function login(){
  await supa.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: window.location.origin + window.location.pathname } });
}

async function ensureUsuario(user){
  try{
    const { data } = await supa.from('usuarios').select('id').eq('id', user.id).maybeSingle();
    if(!data){
      const nombre = user.user_metadata?.full_name || (user.email ? user.email.split('@')[0] : 'Cliente');
      await supa.from('usuarios').upsert({ id:user.id, email:user.email, nombre, rol:'minorista' });
    }
  }catch(e){}
}

// ===== Header tienda =====
function bkBuscar(){ const v=(document.getElementById('bk-buscar').value||'').trim(); if(!v) return; window.location.href='index.html?q='+encodeURIComponent(v.toLowerCase().replace(/\s+/g,'-')); }
function bkFiltrar(valor,tipo){ if(!valor) return; window.location.href='index.html?'+tipo+'='+encodeURIComponent(valor); }
function bkToggleMenu(){ const m=document.getElementById('bk-menu'); if(m) m.style.display = m.style.display==='block'?'none':'block'; }
function bkUserClick(){ if(window._cajaLogueado) bkToggleMenu(); else login(); }
async function logout(){ await supa.auth.signOut(); location.reload(); }
document.addEventListener('click', e=>{ const u=e.target.closest('.bk-user'); if(!u){ const m=document.getElementById('bk-menu'); if(m) m.style.display='none'; } });
async function bkLlenarSelects(){
  try{
    const { data } = await supa.from('productos').select('categoria,marca').neq('estado','inactivo');
    if(!data) return;
    const cats = [...new Set(data.map(p=>p.categoria).filter(Boolean))].sort();
    const marcas = [...new Set(data.map(p=>p.marca).filter(Boolean))].sort();
    const sc=document.getElementById('bk-cat'); if(sc) sc.innerHTML='<option value="" style="color:#1e293b;">Categorías</option>'+cats.map(c=>`<option value="${c}" style="color:#1e293b;">${c}</option>`).join('');
    const sm=document.getElementById('bk-marca'); if(sm) sm.innerHTML='<option value="" style="color:#1e293b;">Marcas</option>'+marcas.map(m=>`<option value="${m}" style="color:#1e293b;">${m}</option>`).join('');
  }catch(e){}
}
function setHeaderUsuario(session){
  const hola=document.getElementById('bk-hola'), chev=document.getElementById('bk-chev'), name=document.getElementById('bk-header-name');
  if(session){
    window._cajaLogueado = true;
    const n = (session.user.user_metadata && session.user.user_metadata.full_name) || (session.user.email? session.user.email.split('@')[0] : 'Mi cuenta');
    if(name) name.textContent = (n||'').split(' ')[0];
    if(hola) hola.style.display='block';
    if(chev) chev.style.display='inline-flex';
  } else {
    window._cajaLogueado = false;
    if(name) name.textContent = 'Ingresá';
    if(hola) hola.style.display='none';
    if(chev) chev.style.display='none';
  }
}
bkLlenarSelects();

async function init(){
  const { data:{ session } } = await supa.auth.getSession();
  setHeaderUsuario(session);
  if(!session){ mostrar('vista-login'); return; }
  await ensureUsuario(session.user);
  try{
    const { data } = await supa.rpc('estado_caja_sorpresa');
    if(data && data.jugo){ verResultado(data.valor, data.codigo, null, true); return; }
    mostrar('vista-juego');
  }catch(e){ mostrar('vista-juego'); }
}

async function abrir(i){
  if(jugando) return; jugando = true;
  const boxes = document.querySelectorAll('#boxes .box');
  boxes[i].classList.add('abriendo');
  try{
    const { data, error } = await supa.rpc('abrir_caja_sorpresa');
    if(error || !data || !data.ok){ jugando=false; boxes[i].classList.remove('abriendo'); alert((data&&data.motivo)||'No se pudo abrir la caja.'); return; }
    // animación: la elegida gana, las otras se apagan
    setTimeout(()=>{
      boxes.forEach((b,idx)=>{ if(idx===i){ b.classList.add('ganadora'); const im=b.querySelector('.caja-img'); if(im){ im.onerror=null; im.src='caja-abierta.png'; } const em=b.querySelector('.emoji'); if(em) em.textContent='🎉'; } else b.classList.add('perdedora'); });
      setTimeout(()=> verResultado(data.valor, data.codigo, data, false), 650);
    }, 500);
  }catch(e){ jugando=false; boxes[i].classList.remove('abriendo'); alert('No se pudo abrir la caja.'); }
}

function verResultado(valor, codigo, data, yaJugo){
  $('res-monto').textContent = money(valor);
  $('res-codigo').textContent = codigo || '—';
  $('res-titulo').textContent = yaJugo ? 'Tu premio' : '¡Ganaste!';
  let det = 'Ya está cargado en tus cupones.';
  if(data && data.min_compra) det += ' Compra mínima ' + money(data.min_compra) + '.';
  if(data && data.vence) det += ' Vence el ' + new Date(data.vence+'T00:00:00').toLocaleDateString('es-AR') + '.';
  if(yaJugo) det = 'Ya jugaste tu intento. Este cupón está en tu cuenta.';
  $('res-detalle').textContent = det;
  $('sub').textContent = yaJugo ? 'Ya usaste tu intento 🎁' : '¡Felicitaciones! 🎉';
  mostrar('vista-resultado');
}

supa.auth.onAuthStateChange((_e, s)=>{ if(s) init(); });
init();
</script>
</body>
</html>
