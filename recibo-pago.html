<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recibo de pago — Blinky MDQ</title>
<link rel="icon" href="https://raw.githubusercontent.com/blinkymdq/blinkymdq/main/blinkysinfondo.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Arial,Helvetica,sans-serif;background:#eef0f4;color:#1e293b;padding:24px 12px;}
  .toolbar{max-width:640px;margin:0 auto 16px;display:flex;gap:10px;justify-content:flex-end;}
  .btn{background:#7c3aed;color:#fff;border:none;border-radius:9px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn.sec{background:#fff;color:#334155;border:1px solid #cbd5e1;}
  .hoja{max-width:640px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.08);overflow:hidden;}
  .top{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;padding:26px 34px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .top img{height:42px;filter:invert(1);}
  .top .doc{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#dcfce7;}
  .top .num{font-size:24px;font-weight:900;}
  .montowrap{text-align:center;padding:28px 24px 6px;}
  .montolbl{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#16a34a;font-weight:700;}
  .monto{font-size:40px;font-weight:900;color:#15803d;margin-top:4px;}
  .meta{padding:14px 34px 26px;font-size:14px;}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef2f7;}
  .row .k{color:#64748b;font-weight:600;}
  .row .v{font-weight:700;text-align:right;}
  .foot{padding:16px 34px;color:#94a3b8;font-size:11px;text-align:center;border-top:1px solid #e2e8f0;}
  .cargando{max-width:640px;margin:40px auto;text-align:center;color:#64748b;}
  @media print{ body{background:#fff;padding:0;} .toolbar{display:none;} .hoja{box-shadow:none;border-radius:0;max-width:none;} }
</style>
</head>
<body>
<div class="toolbar">
  <a class="btn sec" href="index.html">← Inicio</a>
  <button class="btn" onclick="window.print()">⬇ Descargar / Imprimir PDF</button>
</div>
<div id="cont" class="cargando">Cargando recibo…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://fcaytkwcypktvrmerexp.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjYXl0a3djeXBrdHZybWVyZXhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MDU1OTYsImV4cCI6MjA5NzM4MTU5Nn0.7GiUl0o_B3dAnpE2x98sBqtC0eY9HoM6p67fOBghoJY';
const money=n=>'$'+Number(n||0).toLocaleString('es-AR');
const formaLbl=f=>({efectivo:'Efectivo',transferencia:'Transferencia',transferencia_rm:'Transferencia RM',tarjeta:'Tarjeta',saldo_favor:'Saldo a favor'}[f]||f||'—');

async function cargar(){
  const t=new URLSearchParams(location.search).get('t');
  const cont=document.getElementById('cont');
  if(!t){ cont.textContent='Recibo no encontrado.'; return; }
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/rpc/get_recibo_por_token`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY},body:JSON.stringify({p_token:t})});
    const d=await r.json();
    if(!d || !d.numero){ cont.textContent='Recibo no encontrado.'; return; }
    render(d);
  }catch(e){ cont.textContent='No se pudo cargar el recibo.'; }
}
function render(d){
  const fecha=new Date(d.fecha).toLocaleString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const saldo = (d.total_pedido!=null && d.pagado_pedido!=null) ? Math.max(0, Number(d.total_pedido)-Number(d.pagado_pedido)) : null;
  document.getElementById('cont').outerHTML=`
  <div class="hoja">
    <div class="top">
      <img src="https://raw.githubusercontent.com/blinkymdq/blinkymdq/main/blinkysinfondo.png" alt="Blinky MDQ">
      <div style="text-align:right;"><div class="doc">Recibo de pago</div><div class="num">${d.numero}</div></div>
    </div>
    <div class="montowrap"><div class="montolbl">Recibimos</div><div class="monto">${money(d.monto)}</div></div>
    <div class="meta">
      <div class="row"><span class="k">Fecha</span><span class="v">${fecha}</span></div>
      <div class="row"><span class="k">Forma de pago</span><span class="v">${formaLbl(d.forma_pago)}</span></div>
      ${d.cliente?`<div class="row"><span class="k">De</span><span class="v">${d.cliente}</span></div>`:''}
      ${d.numero_pedido?`<div class="row"><span class="k">Pedido</span><span class="v">${d.numero_pedido}</span></div>`:''}
      ${d.total_pedido!=null?`<div class="row"><span class="k">Total del pedido</span><span class="v">${money(d.total_pedido)}</span></div>`:''}
      ${saldo!=null?`<div class="row"><span class="k">Saldo pendiente</span><span class="v" style="color:${saldo>0?'#dc2626':'#16a34a'};">${money(saldo)}</span></div>`:''}
      ${d.descripcion?`<div class="row"><span class="k">Detalle</span><span class="v">${d.descripcion}</span></div>`:''}
    </div>
    <div class="foot">Blinky MDQ · Mar del Plata · blinkymdq.com · Comprobante de pago</div>
  </div>`;
}
cargar();
</script>
</body>
</html>
